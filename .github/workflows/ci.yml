name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: compile / format / credo / test
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Fetch deps
        run: nix develop .#ci -c mix deps.get

      # Compile deps WITHOUT --warnings-as-errors — third-party packages may emit
      # warnings we don't own. The app's own --warnings-as-errors check runs next.
      - name: Compile deps
        run: nix develop .#ci -c mix deps.compile

      - name: Compile (warnings as errors)
        run: nix develop .#ci -c mix compile --warnings-as-errors

      - name: Format check
        run: nix develop .#ci -c mix format --check-formatted

      # Credo is advisory for now (--mute-exit-status): the codebase has pre-existing
      # --strict findings. Make it gating in a follow-up once those are cleaned up.
      - name: Credo
        run: nix develop .#ci -c mix credo --strict --mute-exit-status

      - name: Test
        run: nix develop .#ci -c mix test
